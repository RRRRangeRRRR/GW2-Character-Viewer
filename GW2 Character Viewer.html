<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GW2 Character Viewer</title>
  <style>
    /* Estilos (sin cambios) */
    :root {
      --bg: #13161c;
      --panel: #1d222c;
      --panel-deep: #171b23;
      --line: #2d333f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --fire: #f97316;
      --air: #fbbf24;
      --cyan: #38bdf8;
      --purple: #a78bfa;
      --green: #4ade80;
      --gold: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .poster {
      width: 900px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-deep) 100%);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.45);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .accent { width: 5px; height: 24px; border-radius: 2px; }
    .fire-accent { background: linear-gradient(90deg, var(--fire), var(--air)); }
    .air-accent { background: linear-gradient(90deg, var(--air), #fde047); }
    .cyan-accent { background: linear-gradient(90deg, var(--cyan), var(--purple)); }
    .purple-accent { background: var(--purple); }
    .green-accent { background: var(--green); }

    img.icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      display: block;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      flex-shrink: 0;
    }

    .icon-sm {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
      flex-shrink: 0;
    }

    .header {
      border-radius: 14px;
      border-bottom: 2px solid var(--fire);
      overflow: hidden;
    }

    .header-bg {
      width: 100%;
      height: 200px;
      background-color: var(--bg);
      background-size: auto;
      background-position: left bottom;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
    }

    .header-bg::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .header-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .header h1 {
      font-size: 38px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 .profession-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(2px 2px 6px rgba(0,0,0,0.7));
    }

    .header .subtitle {
      font-size: 18px;
      color: var(--muted);
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    }

    .chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

    .chip {
      background: #1e293b;
      border: 1.5px solid var(--line);
      border-radius: 17px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      color: var(--text);
      white-space: nowrap;
    }

    .chip.level { border-color: var(--green); color: #86efac; }
    .chip.profession { border-color: var(--fire); color: #fdba74; }
    .chip.race { border-color: var(--purple); color: #c4b5fd; }
    .chip.guild { border-color: var(--cyan); color: #7dd3fc; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }

    .stat-item {
      background: #1e293b;
      border: 1px solid #3a4150;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-item .value {
      font-size: 20px;
      font-weight: bold;
      color: var(--cyan);
    }

    .stat-item .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #1e293b;
      color: var(--text);
    }

    .tab-btn.active {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--cyan);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .trait-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .trait-column { display: flex; flex-direction: column; gap: 12px; }

    .trait-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }

    .trait-header.fire { background: #251c1f; border: 1.5px solid var(--fire); color: #fdba74; }
    .trait-header.air { background: #1e231f; border: 1.5px solid var(--air); color: #fde047; }
    .trait-header.water { background: #1a2330; border: 1.5px solid #60a5fa; color: #93c5fd; }
    .trait-header.earth { background: #1f261f; border: 1.5px solid #4ade80; color: #86efac; }
    .trait-header.arcane { background: #221f2e; border: 1.5px solid #a78bfa; color: #c4b5fd; }
    .trait-header.weaver { background: #1a232b; border: 1.5px solid #22d3ee; color: #67e8f9; }
    .trait-header.tempest { background: #1f1f2a; border: 1.5px solid #f472b6; color: #f9a8d4; }
    .trait-header.catalyst { background: #1f2420; border: 1.5px solid #34d399; color: #6ee7b7; }

    .trait-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #20242e;
      border: 1px solid #3a4150;
      border-radius: 6px;
      padding: 6px 8px;
    }

    .trait-row .name { font-size: 15px; flex: 1; }
    .star { color: var(--air); font-size: 14px; }

    .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }

    .skill-slot {
      background: #1e2530;
      border: 1.5px solid #3a4150;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }

    .skill-slot img { margin: 0 auto 8px; }

    .equip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }

    .equip-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .equip-item .item-info {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .equip-item .equip-label {
      font-size: 12px;
      font-weight: bold;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .equip-item .equip-value {
      font-size: 14px;
      color: var(--text);
      line-height: 1.4;
    }

    .stat-prefix-badge {
      display: inline-block;
      background: #1a1f2b;
      border: 1px solid #3a4150;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 11px;
      color: var(--gold);
      margin-top: 2px;
      margin-right: 4px;
    }

    .upgrade-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1a1f2b;
      border: 1px solid #3a4150;
      border-radius: 12px;
      padding: 2px 8px 2px 4px;
      font-size: 12px;
      color: var(--muted);
      margin-right: 4px;
      margin-top: 4px;
    }

    .upgrade-badge img {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }

    .notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .note {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      border: 1px solid #3a4150;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 15px;
    }

    .note.small {
      font-size: 13px;
      color: #cbd5e1;
      border-radius: 16px;
      padding: 6px 12px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      font-size: 20px;
      color: var(--muted);
    }

    .loading .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--line);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .empty-message {
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 16px;
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    .character-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .character-card {
      background: #1e293b;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .character-card:hover {
      border-color: var(--cyan);
      background: #26303f;
      transform: translateY(-2px);
    }

    .character-card .name {
      font-size: 18px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 6px;
    }

    .character-card .detail {
      font-size: 14px;
      color: var(--muted);
    }

    .character-card .detail span {
      display: inline-block;
      margin: 0 4px;
    }

    .token-input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
    }

    .token-input-group input {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: #1a1f2b;
      color: var(--text);
      font-size: 16px;
    }

    .token-input-group input:focus {
      outline: none;
      border-color: var(--cyan);
    }

    .btn {
      background: var(--cyan);
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: bold;
      color: #0f172a;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 16px;
    }

    .btn:hover {
      background: #38bdf8;
    }

    .btn.secondary {
      background: #1e293b;
      color: var(--text);
      border: 1.5px solid var(--line);
    }

    .btn.secondary:hover {
      background: #2d3748;
    }

    .btn.danger {
      background: #b91c1c;
      color: white;
    }

    .btn.danger:hover {
      background: #991b1b;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .error-message {
      color: #f87171;
      background: #1f1a1a;
      border: 1px solid #b91c1c;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 700px) {
      .header h1 { font-size: 26px; }
      .trait-grid { grid-template-columns: 1fr; }
      .skills { grid-template-columns: repeat(2, 1fr); }
      .equip-grid { grid-template-columns: 1fr; }
      .notes-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .tabs { flex-wrap: wrap; }
      .character-list { grid-template-columns: 1fr; }
      .header h1 .profession-icon { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
  <main class="poster" id="app"></main>

  <script>
    // ============================================================
    // ESTADO GLOBAL
    // ============================================================
    let token = null;
    let characterList = [];
    let currentCharacterName = null;

    const API = 'https://api.guildwars2.com/v2';

    // ============================================================
    // FUNCIONES DE API
    // ============================================================
    async function fetchGW2(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      return await res.json();
    }

    async function getCharacters(accessToken) {
      const url = `${API}/characters?access_token=${accessToken}`;
      return fetchGW2(url);
    }

    async function getCharacter(name, accessToken) {
      const url = `${API}/characters/${encodeURIComponent(name)}?access_token=${accessToken}`;
      return fetchGW2(url);
    }

    async function getGuild(guildId, accessToken) {
      if (!guildId) return null;
      const url = `${API}/guild/${guildId}?access_token=${accessToken}`;
      try {
        return await fetchGW2(url);
      } catch {
        return null;
      }
    }

    async function getItems(ids) {
      if (!ids || ids.length === 0) return [];
      const unique = [...new Set(ids.filter(id => id > 0))];
      if (unique.length === 0) return [];
      const url = `${API}/items?ids=${unique.join(',')}&lang=es`;
      const data = await fetchGW2(url);
      return Array.isArray(data) ? data : [data];
    }

    async function getSpecializations(ids) {
      if (!ids || ids.length === 0) return [];
      const url = `${API}/specializations?ids=${ids.join(',')}&lang=es`;
      const data = await fetchGW2(url);
      return Array.isArray(data) ? data : [data];
    }

    async function getTraits(ids) {
      if (!ids || ids.length === 0) return [];
      const url = `${API}/traits?ids=${ids.join(',')}&lang=es`;
      const data = await fetchGW2(url);
      return Array.isArray(data) ? data : [data];
    }

    async function getSkills(ids) {
      if (!ids || ids.length === 0) return [];
      const url = `${API}/skills?ids=${ids.join(',')}&lang=es`;
      const data = await fetchGW2(url);
      return Array.isArray(data) ? data : [data];
    }

    async function getItemStats(ids) {
      if (!ids || ids.length === 0) return [];
      const unique = [...new Set(ids.filter(id => id > 0))];
      if (unique.length === 0) return [];
      const url = `${API}/itemstats?ids=${unique.join(',')}&lang=es`;
      const data = await fetchGW2(url);
      return Array.isArray(data) ? data : [data];
    }

    // Nueva función para obtener el icono de la profesión
    async function getProfessionIcon(profession) {
      if (!profession) return null;
      try {
        const url = `${API}/professions/${encodeURIComponent(profession)}`;
        const data = await fetchGW2(url);
        return data.icon || null;
      } catch {
        return null;
      }
    }

    // ============================================================
    // CONSTANTES DE ATRIBUTOS Y VIDA
    // ============================================================
    const BASE_ATTRIBUTES = {
      power: 1000,
      precision: 1000,
      toughness: 1000,
      vitality: 1000,
      condition: 0,
      concentration: 0,
      expertise: 0,
      healing: 0,
      ferocity: 0
    };

    const BASE_HEALTH_BY_PROFESSION = {
      'Warrior': 19212,
      'Necromancer': 19212,
      'Guardian': 15082,
      'Revenant': 15082,
      'Engineer': 15082,
      'Ranger': 15082,
      'Mesmer': 15082,
      'Elementalist': 11645,
      'Thief': 11645
    };

    const ATTR_LABELS = {
      power: 'Poder',
      precision: 'Precisión',
      toughness: 'Dureza',
      vitality: 'Vitalidad',
      condition: 'Daño por condición',
      concentration: 'Concentración',
      expertise: 'Pericia',
      healing: 'Poder de sanación',
      ferocity: 'Ferocidad'
    };

    const WEAPON_TYPES = {
      'Axe': 'Hacha',
      'Dagger': 'Daga',
      'Mace': 'Maza',
      'Pistol': 'Pistola',
      'Scepter': 'Cetro',
      'Sword': 'Espada',
      'Focus': 'Foco',
      'Shield': 'Escudo',
      'Torch': 'Antorcha',
      'Warhorn': 'Cuerno de guerra',
      'Greatsword': 'Mandoble',
      'Hammer': 'Martillo',
      'Longbow': 'Arco largo',
      'Rifle': 'Rifle',
      'Short Bow': 'Arco corto',
      'Staff': 'Bastón',
      'Spear': 'Lanza',
      'Harpoon Gun': 'Arpón',
      'Trident': 'Tridente'
    };

    // ============================================================
    // UTILIDADES DE RENDERIZADO
    // ============================================================
    function sumEquipmentAttributes(equipment) {
      const attrMap = {};
      const excludedSlots = ['WeaponB1', 'WeaponB2'];
      const filtered = equipment.filter(e => !excludedSlots.includes(e.slot) && e.stats && e.stats.attributes);
      
      for (const item of filtered) {
        const attrs = item.stats.attributes;
        for (const [key, value] of Object.entries(attrs)) {
          const normalizedKey = key.toLowerCase();
          attrMap[normalizedKey] = (attrMap[normalizedKey] || 0) + value;
        }
      }
      return attrMap;
    }

    function getBaseHealth(profession) {
      const prof = profession ? profession.charAt(0).toUpperCase() + profession.slice(1).toLowerCase() : '';
      return BASE_HEALTH_BY_PROFESSION[prof] || 15082;
    }

    function translateWeaponType(item) {
      if (!item || !item.details || !item.details.type) return 'Arma';
      const type = item.details.type;
      return WEAPON_TYPES[type] || type;
    }

    function getStatPrefixName(statId, itemStatsMap) {
      if (!statId) return null;
      const stat = itemStatsMap[statId];
      return stat && stat.name ? stat.name : null;
    }

    function renderEquipItem(label, item, upgrades, statPrefix) {
      let html = `
        <div class="equip-item">
          <img class="icon" src="${item?.icon || ''}" alt="${item?.name || 'Ítem'}" onerror="this.style.display='none'">
          <div class="item-info">
            <div class="equip-label">${label}</div>
            <div class="equip-value">${item?.name || 'Desconocido'}</div>
      `;
      if (statPrefix) {
        html += `<div><span class="stat-prefix-badge">${statPrefix}</span></div>`;
      }
      if (upgrades.length > 0) {
        html += `<div class="upgrades" style="margin-top:4px;">`;
        for (const up of upgrades) {
          html += `
            <span class="upgrade-badge">
              <img class="icon-sm" src="${up.icon || ''}" alt="${up.name}" onerror="this.style.display='none'">
              ${up.name || '?'}
            </span>
          `;
        }
        html += `</div>`;
      }
      html += `
          </div>
        </div>
      `;
      return html;
    }

    // ============================================================
    // CONSTRUCCIÓN DE LA PÁGINA DE DETALLE
    // ============================================================
    function buildDetailPage(charData, guildData, details, itemStatsMap, professionIcon) {
      const modes = ['pve', 'pvp', 'wvw'];
      let activeMode = 'pve';
      for (const m of modes) {
        if (charData.specializations?.[m] && charData.specializations[m].length > 0) {
          activeMode = m;
          break;
        }
      }
      const modeName = activeMode;

      const modeSpecs = charData.specializations?.[modeName] || [];
      const modeSkillsObj = charData.skills?.[modeName] || {};
      const equipment = Array.isArray(charData.equipment) ? charData.equipment : [];

      const weaponsA = equipment.filter(e => e.slot === 'WeaponA1' || e.slot === 'WeaponA2');
      const weaponsB = equipment.filter(e => e.slot === 'WeaponB1' || e.slot === 'WeaponB2');

      const armorSlots = ['Helm', 'Shoulders', 'Coat', 'Gloves', 'Leggings', 'Boots'];
      const armorMap = {};
      equipment.forEach(e => {
        if (armorSlots.includes(e.slot)) {
          armorMap[e.slot] = e;
        }
      });
      const armorOrdered = armorSlots.map(slot => armorMap[slot]).filter(Boolean);

      const accessories = equipment.filter(e => e.slot === 'Accessory1' || e.slot === 'Accessory2' || e.slot === 'Ring1' || e.slot === 'Ring2' || e.slot === 'Amulet');
      const back = equipment.find(e => e.slot === 'Backpack');
      const relic = equipment.find(e => e.slot === 'Relic');

      const { items, specializations, traits, skills } = details;

      const findItem = (id) => items.find(i => i.id === id);
      const findTrait = (id) => traits.find(t => t.id === id);
      const findSkill = (id) => skills.find(s => s.id === id);
      const findSpec = (id) => specializations.find(s => s.id === id);

      const getTraitsForLine = (line) => {
        if (!line || !line.traits) return [];
        const traitIds = Array.isArray(line.traits) ? line.traits : [];
        return traitIds.map(id => findTrait(id)).filter(Boolean);
      };

      const healSkill = modeSkillsObj.heal ? findSkill(modeSkillsObj.heal) : null;
      const utilitySkills = (modeSkillsObj.utilities || []).map(id => findSkill(id)).filter(Boolean);
      const eliteSkill = modeSkillsObj.elite ? findSkill(modeSkillsObj.elite) : null;
      const allSkills = [healSkill, ...utilitySkills, eliteSkill].filter(Boolean);
      const specLines = Array.isArray(modeSpecs) ? modeSpecs : [];

      const baseAttrs = { ...BASE_ATTRIBUTES };
      const equipAttrs = sumEquipmentAttributes(equipment);
      const totalAttrs = { ...baseAttrs };
      for (const [key, value] of Object.entries(equipAttrs)) {
        totalAttrs[key] = (totalAttrs[key] || 0) + value;
      }

      const profession = charData.profession || '';
      const baseHealth = getBaseHealth(profession);
      const vitalityTotal = totalAttrs.vitality || 1000;
      const totalHealth = baseHealth + (vitalityTotal * 10);

      const guildName = guildData ? guildData.name : (charData.guild || null);

      // ----- GENERAR HTML -----
      let html = '';

      const specBg = specLines.length > 0 && specLines[0].id ? findSpec(specLines[0].id) : null;

      // Icono de profesión
      const profIconHtml = professionIcon
        ? `<img class="profession-icon" src="${professionIcon}" alt="${profession}" onerror="this.style.display='none'">`
        : '⚔️';

      html += `
        <header class="header">
          <div class="header-bg" style="background-image: url('${specBg?.background || ''}');">
            <div class="header-content">
              <h1>${profIconHtml} ${charData.name}</h1>
              <div class="subtitle">${charData.profession || 'Desconocido'} · Nivel ${charData.level || '?'}</div>
              <div class="chips">
                <span class="chip level">Nivel ${charData.level || '?'}</span>
                <span class="chip profession">${charData.profession || '?'}</span>
                <span class="chip race">${charData.race || '?'}</span>
                ${guildName ? `<span class="chip guild">${guildName}</span>` : ''}
                <span class="chip" style="border-color:var(--green);color:#86efac;">${charData.age ? Math.floor(charData.age / 86400) + ' días' : '?'}</span>
              </div>
            </div>
          </div>
        </header>
      `;

      // Atributos con tabs
      const attrOrder = ['power', 'precision', 'toughness', 'vitality', 'condition', 'concentration', 'expertise', 'healing', 'ferocity'];

      function renderAttrGrid(attrs, extraHealth = null) {
        let grid = '<div class="stats-grid">';
        for (const key of attrOrder) {
          if (attrs[key] !== undefined) {
            const label = ATTR_LABELS[key] || key.charAt(0).toUpperCase() + key.slice(1);
            grid += `
              <div class="stat-item">
                <div class="value">${attrs[key]}</div>
                <div class="label">${label}</div>
              </div>
            `;
          }
        }
        if (extraHealth !== null) {
          grid += `
            <div class="stat-item">
              <div class="value">${extraHealth.toLocaleString()}</div>
              <div class="label">Vida</div>
            </div>
          `;
        }
        grid += '</div>';
        return grid;
      }

      html += `
        <section class="panel">
          <div class="section-title">
            <span class="accent cyan-accent"></span>
            <span>Atributos</span>
          </div>
          <div class="tabs">
            <button class="tab-btn active" data-tab="total">Totales</button>
            <button class="tab-btn" data-tab="base">Base (nivel 80)</button>
            <button class="tab-btn" data-tab="equipo">Equipo</button>
          </div>
          <div id="tab-total" class="tab-content active">
            ${renderAttrGrid(totalAttrs, totalHealth)}
          </div>
          <div id="tab-base" class="tab-content">
            ${renderAttrGrid(baseAttrs, baseHealth)}
          </div>
          <div id="tab-equipo" class="tab-content">
            ${Object.keys(equipAttrs).length > 0 ? renderAttrGrid(equipAttrs) : '<div class="empty-message">No hay atributos adicionales del equipo.</div>'}
          </div>
        </section>
      `;

      // Rasgos
      if (specLines.length > 0) {
        html += `
          <section class="panel">
            <div class="section-title">
              <span class="accent purple-accent"></span>
              <span>Rasgos</span>
            </div>
            <div class="trait-grid">
        `;

        for (const line of specLines) {
          const spec = findSpec(line.id);
          if (!spec) continue;
          const specTraits = getTraitsForLine(line);
          const tierColor = {
            'Fire': 'fire',
            'Air': 'air',
            'Water': 'water',
            'Earth': 'earth',
            'Arcane': 'arcane',
            'Weaver': 'weaver',
            'Tempest': 'tempest',
            'Catalyst': 'catalyst'
          }[spec.name] || 'fire';

          html += `
            <div class="trait-column">
              <div class="trait-header ${tierColor}">
                <img class="icon" src="${spec.icon || ''}" alt="${spec.name}" onerror="this.style.display='none'">
                ${spec.name}
              </div>
          `;
          if (specTraits.length === 0) {
            html += `<div class="empty-message" style="font-size:14px;padding:8px;">Sin traits seleccionados</div>`;
          } else {
            for (const t of specTraits) {
              if (!t) continue;
              html += `
                <div class="trait-row">
                  <img class="icon" src="${t.icon || ''}" alt="${t.name}" onerror="this.style.display='none'">
                  <span class="name">${t.name || '?'}</span>
                </div>
              `;
            }
          }
          html += `</div>`;
        }
        html += `
            </div>
          </section>
        `;
      } else {
        html += `
          <section class="panel">
            <div class="section-title">
              <span class="accent purple-accent"></span>
              <span>Rasgos</span>
            </div>
            <div class="empty-message">No hay rasgos seleccionados.</div>
          </section>
        `;
      }

      // Habilidades
      if (allSkills.length > 0) {
        html += `
          <section class="panel">
            <div class="section-title">
              <span class="accent air-accent"></span>
              <span>Habilidades</span>
            </div>
            <div class="skills">
        `;
        for (const skill of allSkills) {
          html += `
            <div class="skill-slot">
              <img class="icon" src="${skill.icon || ''}" alt="${skill.name}" onerror="this.style.display='none'">
              ${skill.name || '?'}
            </div>
          `;
        }
        html += `
            </div>
          </section>
        `;
      } else {
        html += `
          <section class="panel">
            <div class="section-title">
              <span class="accent air-accent"></span>
              <span>Habilidades</span>
            </div>
            <div class="empty-message">No hay habilidades en la barra.</div>
          </section>
        `;
      }

      // Equipo
      html += `
        <section class="panel">
          <div class="section-title">
            <span class="accent green-accent"></span>
            <span>Equipo</span>
          </div>
          <div class="equip-grid">
            <div>
      `;

      if (weaponsA.length > 0) {
        for (const w of weaponsA) {
          const item = findItem(w.id);
          const upgrades = (w.upgrades || []).map(id => findItem(id)).filter(Boolean);
          const statPrefix = w.stats ? getStatPrefixName(w.stats.id, itemStatsMap) : null;
          const weaponType = translateWeaponType(item);
          html += renderEquipItem(weaponType, item, upgrades, statPrefix);
        }
      } else {
        html += `<div class="empty-message">Sin armas principales equipadas</div>`;
      }

      if (weaponsB.length > 0) {
        for (const w of weaponsB) {
          const item = findItem(w.id);
          const upgrades = (w.upgrades || []).map(id => findItem(id)).filter(Boolean);
          const statPrefix = w.stats ? getStatPrefixName(w.stats.id, itemStatsMap) : null;
          const weaponType = translateWeaponType(item);
          html += renderEquipItem(weaponType, item, upgrades, statPrefix);
        }
      } else {
        html += `<div class="empty-message">Sin armas secundarias equipadas</div>`;
      }

      if (armorOrdered.length > 0) {
        const slotNames = {
          'Helm': 'Casco',
          'Shoulders': 'Hombros',
          'Coat': 'Pecho',
          'Gloves': 'Guantes',
          'Leggings': 'Pantalones',
          'Boots': 'Botas'
        };
        for (const a of armorOrdered) {
          const item = findItem(a.id);
          const upgrades = (a.upgrades || []).map(id => findItem(id)).filter(Boolean);
          const statPrefix = a.stats ? getStatPrefixName(a.stats.id, itemStatsMap) : null;
          html += renderEquipItem(slotNames[a.slot] || a.slot, item, upgrades, statPrefix);
        }
      } else {
        html += `<div class="empty-message">Sin armadura equipada</div>`;
      }

      html += `
            </div>
            <div>
      `;

      if (accessories.length > 0) {
        const slotNames = {
          'Accessory1': 'Accesorio 1',
          'Accessory2': 'Accesorio 2',
          'Ring1': 'Anillo 1',
          'Ring2': 'Anillo 2',
          'Amulet': 'Amuleto'
        };
        for (const a of accessories) {
          const item = findItem(a.id);
          const upgrades = (a.upgrades || []).map(id => findItem(id)).filter(Boolean);
          const statPrefix = a.stats ? getStatPrefixName(a.stats.id, itemStatsMap) : null;
          html += renderEquipItem(slotNames[a.slot] || a.slot, item, upgrades, statPrefix);
        }
      } else {
        html += `<div class="empty-message">Sin accesorios equipados</div>`;
      }

      if (back) {
        const item = findItem(back.id);
        const upgrades = (back.upgrades || []).map(id => findItem(id)).filter(Boolean);
        const statPrefix = back.stats ? getStatPrefixName(back.stats.id, itemStatsMap) : null;
        html += renderEquipItem('Espalda', item, upgrades, statPrefix);
      } else {
        html += `<div class="empty-message">Sin espalda equipada</div>`;
      }

      if (relic) {
        let item = findItem(relic.id);
        if (!item || !item.name) {
          item = {
            name: 'Reliquia Legendaria',
            icon: 'https://render.guildwars2.com/file/08DED07BF6DF37E69A08D1C49D9C45D81BD8A5CA/3255567.png'
          };
        }
        const upgrades = (relic.upgrades || []).map(id => findItem(id)).filter(Boolean);
        const statPrefix = relic.stats ? getStatPrefixName(relic.stats.id, itemStatsMap) : null;
        html += renderEquipItem('Reliquia', item, upgrades, statPrefix);
      } else {
        html += `<div class="empty-message">Sin reliquia equipada</div>`;
      }

      html += `
            </div>
          </div>
        </section>
      `;

      // Información adicional (sin botones)
      html += `
        <section class="panel">
          <div class="section-title">
            <span class="accent purple-accent"></span>
            <span>Información del Personaje</span>
          </div>
          <div class="notes-grid">
            <div class="note">
              <span>🏷️</span>
              <span><strong>Creación:</strong> ${charData.created ? new Date(charData.created).toLocaleDateString() : '?'}</span>
            </div>
            <div class="note">
              <span>⏱️</span>
              <span><strong>Tiempo jugado:</strong> ${charData.age ? Math.floor(charData.age / 3600) + ' horas' : '?'}</span>
            </div>
            <div class="note small">
              <span>📊</span>
              <span><strong>Muerte(s):</strong> ${charData.deaths || '0'}</span>
            </div>
            <div class="note small">
              <span>🏆</span>
              <span><strong>PVP:</strong> ${charData.pvp?.rank || 'No disponible'}</span>
            </div>
            <div class="note small">
              <span>🗺️</span>
              <span><strong>Mapa actual:</strong> ${charData.map_id || '?'}</span>
            </div>
            <div class="note small">
              <span>📍</span>
              <span><strong>Coordenadas:</strong> ${charData.coords ? Math.round(charData.coords[0]) + ', ' + Math.round(charData.coords[1]) : '?'}</span>
            </div>
          </div>
        </section>
      `;

      // Nuevo panel solo para los botones de navegación
      html += `
        <section class="panel">
          <div class="btn-group">
            <button class="btn secondary" id="backToListBtn">← Volver a la lista</button>
            <button class="btn secondary" id="changeTokenBtn">Cambiar token</button>
          </div>
        </section>
      `;

      return html;
    }

    // ============================================================
    // RENDERIZADO DE ESTADOS
    // ============================================================
    function renderLogin() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="panel" style="max-width:600px;margin:auto;">
          <div class="section-title">
            <span class="accent cyan-accent"></span>
            <span>🔑 Conectar a Guild Wars 2</span>
          </div>
          <p style="color:var(--muted);margin-bottom:16px;">
            Introduce tu <strong>API Key</strong> para cargar tus personajes.
          </p>
          <div class="token-input-group">
            <input type="password" id="tokenInput" placeholder="Ej: 123456-ABCDEF-..." autofocus>
            <button class="btn" id="connectBtn">Conectar</button>
          </div>
          <div id="loginError" class="error-message" style="display:none;"></div>
          <div style="margin-top:16px;font-size:13px;color:var(--muted);">
            Puedes generar una API Key en el <a href="https://account.guildwars2.com/application" target="_blank" style="color:var(--cyan);">portal de aplicaciones</a>.
            <br>Necesita el permiso <strong>characters</strong> y <strong>guilds</strong>.
          </div>
        </div>
      `;

      document.getElementById('connectBtn').addEventListener('click', handleConnect);
      document.getElementById('tokenInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleConnect();
      });
    }

    function renderCharacterList(list) {
      const app = document.getElementById('app');
      let cards = '';
      if (list.length === 0) {
        cards = `<div class="empty-message">No se encontraron personajes en esta cuenta.</div>`;
      } else {
        cards = `<div class="character-list">`;
        for (const name of list) {
          cards += `
            <div class="character-card" data-name="${name}">
              <div class="name">${name}</div>
              <div class="detail">Haz clic para ver detalles</div>
            </div>
          `;
        }
        cards += `</div>`;
      }

      app.innerHTML = `
        <div class="panel">
          <div class="section-title">
            <span class="accent purple-accent"></span>
            <span>👥 Selecciona un personaje</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:8px;">
            <span style="color:var(--muted);">${list.length} personaje${list.length !== 1 ? 's' : ''} encontrado${list.length !== 1 ? 's' : ''}</span>
            <button class="btn secondary" id="changeTokenFromListBtn">Cambiar token</button>
          </div>
          ${cards}
          <div id="listError" class="error-message" style="display:none;"></div>
        </div>
      `;

      document.querySelectorAll('.character-card').forEach(card => {
        card.addEventListener('click', function() {
          const name = this.dataset.name;
          loadCharacterDetail(name);
        });
      });

      document.getElementById('changeTokenFromListBtn').addEventListener('click', () => {
        token = null;
        currentCharacterName = null;
        renderLogin();
      });
    }

    function renderLoading(message = 'Cargando datos del personaje...') {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>${message}</div>
          <div style="font-size:14px;margin-top:8px;color:var(--muted);">Consultando API de Guild Wars 2</div>
        </div>
      `;
    }

    function renderError(message) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="loading" style="color:#f87171;">
          <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
          <div><strong>Error</strong></div>
          <div style="font-size:14px;margin-top:8px;color:var(--muted);">${message}</div>
          <div style="margin-top:20px;">
            <button class="btn secondary" id="retryBtn">Reintentar</button>
            <button class="btn secondary" id="backToLoginBtn">Volver al inicio</button>
          </div>
        </div>
      `;
      document.getElementById('retryBtn')?.addEventListener('click', () => {
        if (currentCharacterName) {
          loadCharacterDetail(currentCharacterName);
        } else {
          handleConnect();
        }
      });
      document.getElementById('backToLoginBtn')?.addEventListener('click', () => {
        token = null;
        currentCharacterName = null;
        renderLogin();
      });
    }

    // ============================================================
    // MANEJADORES DE ACCIONES
    // ============================================================
    async function handleConnect() {
      const input = document.getElementById('tokenInput');
      const errorDiv = document.getElementById('loginError');
      const tokenValue = input.value.trim();

      if (!tokenValue) {
        errorDiv.textContent = 'Por favor, introduce una API Key.';
        errorDiv.style.display = 'block';
        return;
      }

      errorDiv.style.display = 'none';
      token = tokenValue;
      renderLoading('Conectando y obteniendo lista de personajes...');

      try {
        const names = await getCharacters(token);
        characterList = names;
        renderCharacterList(characterList);
      } catch (err) {
        errorDiv.textContent = `Error al conectar: ${err.message}`;
        errorDiv.style.display = 'block';
        token = null;
        renderLogin();
      }
    }

    async function loadCharacterDetail(name) {
      if (!token) {
        renderLogin();
        return;
      }

      currentCharacterName = name;
      renderLoading(`Cargando datos de ${name}...`);

      try {
        // Obtener datos del personaje
        const charData = await getCharacter(name, token);

        // Obtener icono de la profesión
        let professionIcon = null;
        if (charData.profession) {
          professionIcon = await getProfessionIcon(charData.profession);
        }

        let guildData = null;
        if (charData.guild) {
          guildData = await getGuild(charData.guild, token);
        }

        // Recopilar IDs
        const modes = ['pve', 'pvp', 'wvw'];
        const allItemIds = new Set();
        const allSpecIds = new Set();
        const allTraitIds = new Set();
        const allSkillIds = new Set();
        const allStatIds = new Set();

        const equip = Array.isArray(charData.equipment) ? charData.equipment : [];
        equip.forEach(e => {
          if (e.id) allItemIds.add(e.id);
          if (e.upgrades) {
            e.upgrades.forEach(id => { if (id) allItemIds.add(id); });
          }
          if (e.stats && e.stats.id) {
            allStatIds.add(e.stats.id);
          }
        });

        for (const mode of modes) {
          const specs = charData.specializations?.[mode] || [];
          if (Array.isArray(specs)) {
            specs.forEach(s => {
              if (s.id) allSpecIds.add(s.id);
              if (s.traits && Array.isArray(s.traits)) {
                s.traits.forEach(tid => allTraitIds.add(tid));
              }
            });
          }
          const skills = charData.skills?.[mode] || {};
          if (skills.heal) allSkillIds.add(skills.heal);
          if (skills.elite) allSkillIds.add(skills.elite);
          if (Array.isArray(skills.utilities)) {
            skills.utilities.forEach(id => allSkillIds.add(id));
          }
        }

        const [items, specializations, traits, skills, itemStats] = await Promise.all([
          getItems([...allItemIds]),
          getSpecializations([...allSpecIds]),
          getTraits([...allTraitIds]),
          getSkills([...allSkillIds]),
          getItemStats([...allStatIds])
        ]);

        const itemStatsMap = {};
        itemStats.forEach(stat => {
          itemStatsMap[stat.id] = stat;
        });

        const details = { items, specializations, traits, skills };
        const html = buildDetailPage(charData, guildData, details, itemStatsMap, professionIcon);
        document.getElementById('app').innerHTML = html;

        // Inicializar tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            const tabId = this.dataset.tab;
            const target = document.getElementById('tab-' + tabId);
            if (target) target.classList.add('active');
          });
        });

        // Botones de navegación
        document.getElementById('backToListBtn')?.addEventListener('click', () => {
          if (characterList.length > 0) {
            renderCharacterList(characterList);
          } else {
            renderLogin();
          }
        });

        document.getElementById('changeTokenBtn')?.addEventListener('click', () => {
          token = null;
          currentCharacterName = null;
          renderLogin();
        });

      } catch (err) {
        console.error('Error loading character:', err);
        renderError(`No se pudo cargar el personaje: ${err.message}`);
      }
    }

    // ============================================================
    // INICIO
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Intentar recuperar token de sessionStorage
      const savedToken = sessionStorage.getItem('gw2_token');
      if (savedToken) {
        token = savedToken;
        renderLoading('Conectando con token guardado...');
        getCharacters(token)
          .then(names => {
            characterList = names;
            renderCharacterList(characterList);
          })
          .catch(() => {
            sessionStorage.removeItem('gw2_token');
            token = null;
            renderLogin();
          });
      } else {
        renderLogin();
      }

      // Guardar token en sessionStorage cuando se conecte
      const origHandleConnect = handleConnect;
      handleConnect = async function() {
        await origHandleConnect();
        if (token) {
          sessionStorage.setItem('gw2_token', token);
        }
      };
    });
  </script>
</body>
</html>
