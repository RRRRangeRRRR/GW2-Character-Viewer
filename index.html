<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GW2 Character Viewer + Creador Web</title>
  

  <link rel="stylesheet" href="gw2character_viewer.css" />
</head>
<body>
  <main class="poster" id="app"></main>

  <!-- Popup de previsualización de exportación -->
  <div class="popup-overlay preview-popup" id="previewPopup">
    <div class="popup-box">
      <button class="popup-close" id="previewClose">&times;</button>
      <h2 style="margin-bottom:12px;">Vista previa del HTML exportado</h2>
      <div class="preview-content" id="previewContent"></div>
      <div class="popup-actions">
        <button class="btn-cancel" id="previewCancel">Cancelar</button>
        <button class="btn-confirm" id="previewConfirm">✅ Confirmar y descargar</button>
      </div>
    </div>
  </div>

  <!-- Popup overlay común (para los detalles) -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <button class="popup-close" id="popupClose">&times;</button>
      <div id="popupContent"></div>
    </div>
  </div>

  

  <script src="gw2character_viewer.js"></script>
</body>
</html>
